
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel Boot Process</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-deep: #050608;
            --bg-primary: #0a0d12;
            --bg-secondary: #111820;
            --bg-tertiary: #1a222d;
            --bg-panel: #0d1117;
            --text-bright: #f0f4f8;
            --text-primary: #c9d1d9;
            --text-muted: #6e7681;
            --accent-amber: #f0a500;
            --accent-orange: #ff6b35;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-purple: #a855f7;
            --accent-red: #ff4757;
            --border-subtle: #21262d;
            --border-glow: #30363d;
            --glass: rgba(17, 24, 32, 0.85);
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.03) 0%, transparent 50%);
        }
        
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
            gap: 24px;
        }
        
        /* Timeline Navigation */
        .timeline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 20px 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            position: relative;
            overflow: hidden;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.5;
        }
        
        .timeline-track {
            position: absolute;
            height: 2px;
            background: var(--border-glow);
            left: 60px;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 0;
        }
        
        .timeline-progress {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-amber), var(--accent-orange));
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px var(--accent-amber);
        }
        
        .step-marker {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 2;
            margin: 0 16px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }
        
        .step-marker:hover {
            transform: scale(1.1);
            border-color: var(--accent-cyan);
            color: var(--text-bright);
        }
        
        .step-marker.completed {
            background: linear-gradient(135deg, var(--accent-green), #00cc6f);
            border-color: var(--accent-green);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        
        .step-marker.active {
            background: linear-gradient(135deg, var(--accent-amber), var(--accent-orange));
            border-color: var(--accent-amber);
            color: var(--bg-deep);
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(240, 165, 0, 0.5);
            animation: activePulse 2s ease-in-out infinite;
        }
        
        @keyframes activePulse {
            0%, 100% { box-shadow: 0 0 30px rgba(240, 165, 0, 0.5); }
            50% { box-shadow: 0 0 50px rgba(240, 165, 0, 0.7); }
        }
        
        .step-label {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            white-space: nowrap;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.3s;
            font-family: 'Fira Code', monospace;
        }
        
        .step-marker:hover .step-label,
        .step-marker.active .step-label {
            opacity: 1;
        }
        
        /* Main Layout */
        .main-area {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }
        
        /* Hardware Visualization Panel */
        .hardware-panel {
            background: var(--bg-panel);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            padding: 28px;
            position: relative;
            overflow: hidden;
        }
        
        .hardware-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(180deg, rgba(0, 212, 255, 0.02) 0%, transparent 30%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px);
            pointer-events: none;
        }
        
        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .panel-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .panel-title {
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        
        /* Component Grid */
        .components-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .component-card {
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-subtle);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .component-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.02));
            pointer-events: none;
        }
        
        .component-card.active {
            border-color: var(--accent-amber);
            transform: translateY(-4px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(240, 165, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .component-card.active::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--accent-amber), var(--accent-orange));
            border-radius: 18px;
            z-index: -1;
            opacity: 0.3;
            filter: blur(8px);
        }
        
        .component-visual {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            position: relative;
        }
        
        .component-visual svg {
            width: 100%;
            height: 100%;
        }
        
        .component-name {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            color: var(--text-bright);
            margin-bottom: 8px;
        }
        
        .component-status {
            font-size: 11px;
            text-align: center;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            padding: 6px 12px;
            background: var(--bg-primary);
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .component-card.active .component-status {
            background: rgba(240, 165, 0, 0.15);
            color: var(--accent-amber);
        }
        
        /* Data Flow Visualization */
        .data-flow {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 28px;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 12px;
            position: relative;
        }
        
        .flow-node {
            padding: 10px 18px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            border: 1px solid var(--border-subtle);
            transition: all 0.4s;
            opacity: 0.4;
        }
        
        .flow-node.active {
            opacity: 1;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        
        .flow-arrow {
            display: flex;
            align-items: center;
            color: var(--border-glow);
            font-size: 18px;
            transition: all 0.4s;
        }
        
        .flow-arrow.active {
            color: var(--accent-green);
            text-shadow: 0 0 10px var(--accent-green);
            animation: flowPulse 1s ease-in-out infinite;
        }
        
        @keyframes flowPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        /* Memory Map */
        .memory-section {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-subtle);
        }
        
        .memory-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .memory-title::before {
            content: '▪';
            color: var(--accent-purple);
        }
        
        .memory-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .memory-block {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.35;
            transform: translateX(-10px);
            border-left: 4px solid transparent;
        }
        
        .memory-block.active {
            opacity: 1;
            transform: translateX(0);
        }
        
        .memory-block.kernel {
            background: linear-gradient(90deg, rgba(0, 255, 136, 0.1), transparent);
            border-left-color: var(--accent-green);
        }
        
        .memory-block.kernel.active {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }
        
        .memory-block.stack {
            background: linear-gradient(90deg, rgba(240, 165, 0, 0.1), transparent);
            border-left-color: var(--accent-amber);
        }
        
        .memory-block.stack.active {
            box-shadow: 0 0 30px rgba(240, 165, 0, 0.1);
        }
        
        .memory-block.bios {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.1), transparent);
            border-left-color: var(--accent-purple);
        }
        
        .memory-block.bios.active {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.1);
        }
        
        .memory-block.reserved {
            background: linear-gradient(90deg, rgba(110, 118, 129, 0.1), transparent);
            border-left-color: var(--text-muted);
        }
        
        .memory-label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .memory-icon {
            font-size: 14px;
        }
        
        .memory-addr {
            color: var(--accent-cyan);
            font-size: 11px;
        }
        
        /* Info Panel */
        .info-panel {
            background: var(--bg-panel);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            padding: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .info-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, rgba(240, 165, 0, 0.03) 0%, transparent);
            pointer-events: none;
        }
        
        .step-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(240, 165, 0, 0.2), rgba(255, 107, 53, 0.1));
            border-radius: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--accent-amber);
            margin-bottom: 16px;
            width: fit-content;
            border: 1px solid rgba(240, 165, 0, 0.3);
        }
        
        .step-badge-num {
            width: 22px;
            height: 22px;
            background: var(--accent-amber);
            color: var(--bg-deep);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
        }
        
        .step-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 16px;
            line-height: 1.3;
        }
        
        .step-desc {
            color: var(--text-primary);
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 24px;
            flex: 0 0 auto;
        }
        
        .step-desc strong {
            color: var(--accent-cyan);
            font-weight: 600;
        }
        
        .code-container {
            background: var(--bg-deep);
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            margin-bottom: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .code-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .code-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .code-dot.red { background: #ff5f56; }
        .code-dot.yellow { background: #ffbd2e; }
        .code-dot.green { background: #27ca40; }
        
        .code-lang {
            margin-left: auto;
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .code-body {
            padding: 18px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.8;
            overflow-x: auto;
            flex: 1;
        }
        
        .code-body .comment { color: #6a737d; font-style: italic; }
        .code-body .keyword { color: #ff79c6; }
        .code-body .string { color: #98c379; }
        .code-body .number { color: #f0a500; }
        .code-body .function { color: #61afef; }
        .code-body .type { color: #e5c07b; }
        .code-body .directive { color: #c678dd; }
        
        .insight-box {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(168, 85, 247, 0.05));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 18px;
            margin-top: auto;
        }
        
        .insight-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .insight-text {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.7;
        }
        
        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 12px;
        }
        
        .btn {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-amber), var(--accent-orange));
            color: var(--bg-deep);
            box-shadow: 0 4px 20px rgba(240, 165, 0, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(240, 165, 0, 0.4);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-glow);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--border-glow);
            border-color: var(--text-muted);
        }
        
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-icon {
            font-size: 18px;
        }
        
        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .main-area {
                grid-template-columns: 1fr;
            }
            
            .components-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .step-marker {
                width: 36px;
                height: 36px;
                margin: 0 8px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 640px) {
            .components-grid {
                grid-template-columns: 1fr;
            }
            
            .data-flow {
                flex-wrap: wrap;
            }
        }
        
        /* Activity indicator */
        .activity-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: var(--accent-amber);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .component-card.active .activity-ring {
            opacity: 1;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Glow effects for dark mode support */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-deep: #f5f7fa;
                --bg-primary: #ffffff;
                --bg-secondary: #f0f2f5;
                --bg-tertiary: #e8ebef;
                --bg-panel: #ffffff;
                --text-bright: #1a1a2e;
                --text-primary: #2d3748;
                --text-muted: #718096;
                --border-subtle: #e2e8f0;
                --border-glow: #cbd5e0;
                --glass: rgba(255, 255, 255, 0.9);
            }
            
            .hardware-panel::before,
            .info-panel::before {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="timeline" role="navigation" aria-label="Boot process steps">
            <div class="timeline-track"></div>
            <div class="timeline-progress" id="timeline-progress"></div>
        </nav>
        
        <div class="main-area">
            <div class="hardware-panel">
                <div class="panel-header">
                    <div class="panel-icon">⚡</div>
                    <div class="panel-title">System Architecture</div>
                </div>
                
                <div class="components-grid">
                    <div class="component-card" id="comp-cpu">
                        <div class="component-visual">
                            <svg viewBox="0 0 64 64" fill="none">
                                <rect x="12" y="12" width="40" height="40" rx="4" fill="#1a222d" stroke="#30363d" stroke-width="2"/>
                                <rect x="18" y="18" width="28" height="28" rx="2" fill="#0a0d12"/>
                                <rect x="22" y="22" width="20" height="20" fill="url(#cpuGrad)"/>
                                <path d="M8 24h4M8 32h4M8 40h4M52 24h4M52 32h4M52 40h4M24 8v4M32 8v4M40 8v4M24 52v4M32 52v4M40 52v4" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
                                <defs>
                                    <linearGradient id="cpuGrad" x1="22" y1="22" x2="42" y2="42">
                                        <stop offset="0%" stop-color="#21262d"/>
                                        <stop offset="100%" stop-color="#161b22"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                            <div class="activity-ring"></div>
                        </div>
                        <div class="component-name">CPU</div>
                        <div class="component-status" id="cpu-status">Idle</div>
                    </div>
                    
                    <div class="component-card" id="comp-bios">
                        <div class="component-visual">
                            <svg viewBox="0 0 64 64" fill="none">
                                <rect x="8" y="16" width="48" height="32" rx="4" fill="#1a222d" stroke="#30363d" stroke-width="2"/>
                                <rect x="14" y="22" width="36" height="20" rx="2" fill="#0a0d12"/>
                                <rect x="18" y="26" width="8" height="4" rx="1" fill="#a855f7" opacity="0.6"/>
                                <rect x="28" y="26" width="8" height="4" rx="1" fill="#a855f7" opacity="0.4"/>
                                <rect x="38" y="26" width="8" height="4" rx="1" fill="#a855f7" opacity="0.2"/>
                                <rect x="18" y="34" width="28" height="4" rx="1" fill="#21262d"/>
                                <circle cx="32" cy="12" r="3" fill="#30363d"/>
                                <div class="activity-ring"></div>
                            </svg>
                            <div class="activity-ring"></div>
                        </div>
                        <div class="component-name">BIOS/UEFI</div>
                        <div class="component-status" id="bios-status">Firmware</div>
                    </div>
                    
                    <div class="component-card" id="comp-disk">
                        <div class="component-visual">
                            <svg viewBox="0 0 64 64" fill="none">
                                <rect x="10" y="14" width="44" height="36" rx="4" fill="#1a222d" stroke="#30363d" stroke-width="2"/>
                                <circle cx="32" cy="30" r="12" fill="#0a0d12" stroke="#21262d" stroke-width="2"/>
                                <circle cx="32" cy="30" r="4" fill="#30363d"/>
                                <circle cx="32" cy="30" r="1" fill="#00d4ff"/>
                                <rect x="16" y="42" width="32" height="4" rx="1" fill="#21262d"/>
                                <circle cx="48" cy="20" r="2" fill="#00ff88" opacity="0.6"/>
                            </svg>
                            <div class="activity-ring"></div>
                        </div>
                        <div class="component-name">Boot Disk</div>
                        <div class="component-status" id="disk-status">Ready</div>
                    </div>
                </div>
                
                <div class="data-flow">
                    <div class="flow-node" id="flow-bios">BIOS</div>
                    <div class="flow-arrow" id="arrow-1">→</div>
                    <div class="flow-node" id="flow-grub">GRUB</div>
                    <div class="flow-arrow" id="arrow-2">→</div>
                    <div class="flow-node" id="flow-kernel">Kernel</div>
                </div>
                
                <div class="memory-section">
                    <div class="memory-title">Memory Layout</div>
                    <div class="memory-stack">
                        <div class="memory-block reserved" data-region="high">
                            <span class="memory-label"><span class="memory-icon">▫</span> High Memory</span>
                            <span class="memory-addr">0xFFFFFFFF</span>
                        </div>
                        <div class="memory-block kernel" data-region="kernel">
                            <span class="memory-label"><span class="memory-icon">◆</span> Kernel Image</span>
                            <span class="memory-addr">0x00100000</span>
                        </div>
                        <div class="memory-block stack" data-region="stack">
                            <span class="memory-label"><span class="memory-icon">▤</span> Stack</span>
                            <span class="memory-addr">stack_top</span>
                        </div>
                        <div class="memory-block bios" data-region="bios">
                            <span class="memory-label"><span class="memory-icon">◈</span> BIOS/Reserved</span>
                            <span class="memory-addr">0x00000000</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="info-panel" id="info-panel">
                <!-- Content populated by JS -->
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-secondary" id="btn-prev" aria-label="Previous step">
                <span class="btn-icon">←</span> Previous
            </button>
            <button class="btn btn-primary" id="btn-next" aria-label="Next step">
                Next <span class="btn-icon">→</span>
            </button>
        </div>
    </div>
    
    <script>
        const steps = [
            {
                title: "Power On & Reset",
                components: ["comp-cpu", "comp-bios"],
                memory: [],
                flow: ["flow-bios"],
                arrows: [],
                status: { cpu: "Reset vector", bios: "Initializing", disk: "Idle" },
                description: "When you press power, electricity flows to the CPU. The CPU awakens at a hardcoded address called the <strong>reset vector</strong> (0xFFFFFFF0), which points directly to BIOS firmware stored in ROM.",
                code: `<span class="comment">; CPU starts execution here</span>
<span class="comment">; Reset Vector: 0xFFFFFFF0</span>

<span class="directive">org</span> <span class="number">0xFFFFFFF0</span>
    <span class="keyword">jmp</span> far <span class="number">0xF000:0xE05B</span>  <span class="comment">; Jump to BIOS</span>`,
                lang: "x86 Assembly",
                insight: "The CPU doesn't know what an operating system is. It simply starts executing instructions from a fixed memory address where BIOS code lives."
            },
            {
                title: "BIOS POST (Power-On Self-Test)",
                components: ["comp-bios"],
                memory: ["bios"],
                flow: ["flow-bios"],
                arrows: [],
                status: { cpu: "Running BIOS", bios: "POST running", disk: "Testing..." },
                description: "BIOS runs <strong>POST</strong> — a series of hardware tests. It checks RAM integrity, detects the CPU, initializes video, and scans for connected devices. Failures produce error beep codes.",
                code: `<span class="comment">/* BIOS POST Sequence */</span>
<span class="function">test_cpu_registers</span>();
<span class="function">verify_bios_checksum</span>();
<span class="function">test_ram</span>(<span class="number">0x00000000</span>, <span class="number">0x000FFFFF</span>);
<span class="function">init_interrupt_table</span>();
<span class="function">init_video_bios</span>();
<span class="function">scan_pci_devices</span>();`,
                lang: "C Pseudocode",
                insight: "Without working RAM, there's nowhere to load the operating system. POST ensures the hardware foundation is solid before proceeding."
            },
            {
                title: "Boot Device Detection",
                components: ["comp-bios", "comp-disk"],
                memory: ["bios"],
                flow: ["flow-bios"],
                arrows: ["arrow-1"],
                status: { cpu: "Running BIOS", bios: "Scanning...", disk: "Found!" },
                description: "BIOS searches for bootable devices in priority order (configured in BIOS setup). It reads the first sector (512 bytes) of each disk, looking for the <strong>boot signature</strong>: 0x55AA at bytes 510-511.",
                code: `<span class="comment">; Master Boot Record (MBR) Layout</span>
<span class="comment">; Total: 512 bytes</span>

<span class="number">0x000-0x1BD</span>: Bootstrap code (<span class="number">446</span> bytes)
<span class="number">0x1BE-0x1FD</span>: Partition table (<span class="number">64</span> bytes)
<span class="number">0x1FE-0x1FF</span>: Boot signature

<span class="keyword">dw</span> <span class="number">0xAA55</span>  <span class="comment">; Magic number (little-endian)</span>`,
                lang: "x86 Assembly",
                insight: "The magic bytes 0x55AA act as a simple validation. Without this signature, BIOS assumes the disk isn't bootable and tries the next device."
            },
            {
                title: "GRUB Stage 1 Loads",
                components: ["comp-disk", "comp-bios"],
                memory: ["bios"],
                flow: ["flow-bios", "flow-grub"],
                arrows: ["arrow-1"],
                status: { cpu: "Executing MBR", bios: "Handoff done", disk: "Reading..." },
                description: "BIOS loads the 512-byte MBR to address <strong>0x7C00</strong> and jumps there. GRUB's Stage 1 code lives here — it's tiny, only enough to locate and load Stage 2.",
                code: `<span class="comment">; GRUB Stage 1 (boot.S simplified)</span>
<span class="directive">org</span> <span class="number">0x7C00</span>

<span class="keyword">mov</span> ax, <span class="number">0x0000</span>
<span class="keyword">mov</span> ds, ax
<span class="keyword">mov</span> es, ax
<span class="keyword">mov</span> ss, ax
<span class="keyword">mov</span> sp, <span class="number">0x7C00</span>   <span class="comment">; Stack below code</span>

<span class="comment">; Load Stage 1.5/2 from disk</span>
<span class="keyword">mov</span> ah, <span class="number">0x42</span>      <span class="comment">; Extended read</span>
<span class="keyword">int</span> <span class="number">0x13</span>         <span class="comment">; BIOS disk interrupt</span>
<span class="keyword">jmp</span> stage2_start`,
                lang: "x86 Assembly",
                insight: "With only 446 bytes available, Stage 1 can't do much. Its sole purpose is bootstrapping — loading the larger Stage 2 that has real capabilities."
            },
            {
                title: "GRUB Stage 2 — The Real Bootloader",
                components: ["comp-disk"],
                memory: ["bios"],
                flow: ["flow-grub"],
                arrows: ["arrow-1", "arrow-2"],
                status: { cpu: "Running GRUB", bios: "Complete", disk: "Active" },
                description: "Stage 2 is the full GRUB bootloader. It can read filesystems (ext4, FAT, etc.), parse configuration files, display a boot menu, and load kernels. It searches for a Multiboot-compliant kernel.",
                code: `<span class="comment"># /boot/grub/grub.cfg</span>
<span class="keyword">set</span> timeout=<span class="number">5</span>
<span class="keyword">set</span> default=<span class="number">0</span>

<span class="keyword">menuentry</span> <span class="string">"My Kernel"</span> {
    <span class="keyword">multiboot</span> /boot/mykernel.bin
    <span class="keyword">boot</span>
}`,
                lang: "GRUB Config",
                insight: "GRUB is essentially a mini operating system. It has drivers for reading filesystems, enough to locate and load your actual kernel."
            },
            {
                title: "Multiboot Header Validation",
                components: ["comp-disk"],
                memory: [],
                flow: ["flow-grub", "flow-kernel"],
                arrows: ["arrow-2"],
                status: { cpu: "GRUB parsing", bios: "Complete", disk: "Reading kernel" },
                description: "GRUB scans the first 8KB of the kernel file for a <strong>Multiboot header</strong>. This header contains magic numbers and flags that tell GRUB how to properly load the kernel.",
                code: `<span class="comment">; Multiboot header - must be in first 8KB</span>
<span class="directive">section</span> .multiboot
<span class="keyword">align</span> <span class="number">4</span>

<span class="directive">MAGIC</span>    <span class="keyword">equ</span> <span class="number">0x1BADB002</span>
<span class="directive">FLAGS</span>    <span class="keyword">equ</span> <span class="number">0x00000003</span>  <span class="comment">; Align + meminfo</span>
<span class="directive">CHECKSUM</span> <span class="keyword">equ</span> -(MAGIC + FLAGS)

<span class="keyword">dd</span> MAGIC
<span class="keyword">dd</span> FLAGS
<span class="keyword">dd</span> CHECKSUM`,
                lang: "x86 Assembly",
                insight: "The magic 0x1BADB002 (read as '1 bad boot 2') is a signature GRUB recognizes. The checksum must make the sum of all three fields equal zero."
            },
            {
                title: "Kernel Loaded to Memory",
                components: ["comp-disk"],
                memory: ["kernel", "bios"],
                flow: ["flow-kernel"],
                arrows: ["arrow-2"],
                status: { cpu: "Loading...", bios: "Complete", disk: "Transfer done" },
                description: "GRUB copies the kernel binary to physical address <strong>0x00100000</strong> (the 1MB mark). This address is above the legacy BIOS area, giving your kernel a clean memory region.",
                code: `<span class="comment">/* Physical Memory Map */</span>

<span class="number">0x00000000</span> - <span class="number">0x000003FF</span>  <span class="comment">// IVT (Interrupt Vector Table)</span>
<span class="number">0x00000400</span> - <span class="number">0x000004FF</span>  <span class="comment">// BIOS Data Area</span>
<span class="number">0x00000500</span> - <span class="number">0x00007BFF</span>  <span class="comment">// Free (conventional)</span>
<span class="number">0x00007C00</span> - <span class="number">0x00007DFF</span>  <span class="comment">// MBR loaded here</span>
<span class="number">0x00007E00</span> - <span class="number">0x0009FFFF</span>  <span class="comment">// Free</span>
<span class="number">0x000A0000</span> - <span class="number">0x000FFFFF</span>  <span class="comment">// Video/ROM/BIOS</span>
<span class="number">0x00100000</span> - ...        <span class="comment">// <span class="string">KERNEL HERE</span></span>`,
                lang: "Memory Layout",
                insight: "The first megabyte is a minefield of legacy BIOS structures. Loading at 1MB gives you guaranteed free memory."
            },
            {
                title: "Stack Initialization",
                components: [],
                memory: ["kernel", "stack", "bios"],
                flow: ["flow-kernel"],
                arrows: [],
                status: { cpu: "Preparing...", bios: "Complete", disk: "Complete" },
                description: "Before any C code can execute, we need a <strong>stack</strong>. The stack stores function return addresses, local variables, and parameters. Assembly code reserves memory and sets the stack pointer (ESP).",
                code: `<span class="directive">section</span> .bss
<span class="keyword">align</span> <span class="number">16</span>
stack_bottom:
    <span class="keyword">resb</span> <span class="number">16384</span>        <span class="comment">; Reserve 16 KB</span>
stack_top:

<span class="directive">section</span> .text
<span class="directive">global</span> _start
<span class="function">_start</span>:
    <span class="keyword">mov</span> esp, stack_top  <span class="comment">; Point ESP to top</span>
    <span class="comment">; Stack grows downward!</span>`,
                lang: "x86 Assembly",
                insight: "C functions need a stack to work. Without ESP pointing to valid memory, the first function call would crash immediately."
            },
            {
                title: "Entry Point: _start",
                components: ["comp-cpu"],
                memory: ["kernel", "stack", "bios"],
                flow: ["flow-kernel"],
                arrows: [],
                status: { cpu: "In _start", bios: "Complete", disk: "Complete" },
                description: "GRUB transfers control to your kernel's <strong>_start</strong> symbol — the entry point. This assembly code sets up the stack and prepares to call your C kernel_main function.",
                code: `<span class="directive">global</span> _start
<span class="directive">extern</span> kernel_main

<span class="function">_start</span>:
    <span class="comment">; EAX = Multiboot magic (0x2BADB002)</span>
    <span class="comment">; EBX = Multiboot info structure pointer</span>
    
    <span class="keyword">mov</span> esp, stack_top
    
    <span class="comment">; Push multiboot info for kernel_main</span>
    <span class="keyword">push</span> ebx          <span class="comment">; Multiboot info</span>
    <span class="keyword">push</span> eax          <span class="comment">; Magic number</span>
    
    <span class="keyword">call</span> <span class="function">kernel_main</span>
    
    <span class="comment">; If kernel_main returns, halt</span>
    <span class="keyword">cli</span>               <span class="comment">; Disable interrupts</span>
    <span class="keyword">hlt</span>               <span class="comment">; Halt CPU</span>`,
                lang: "x86 Assembly",
                insight: "_start is the bridge between the bootloader world and your C code. It receives control from GRUB and transfers it to your kernel."
            },
            {
                title: "kernel_main() — You're in Control",
                components: ["comp-cpu"],
                memory: ["kernel", "stack", "bios"],
                flow: ["flow-kernel"],
                arrows: [],
                status: { cpu: "KERNEL RUNNING", bios: "Complete", disk: "Complete" },
                description: "Your <strong>kernel_main()</strong> function is now executing. There's no operating system beneath you — <em>you ARE the operating system</em>. Every feature must be built from scratch.",
                code: `<span class="type">void</span> <span class="function">kernel_main</span>(
    <span class="type">uint32_t</span> magic,
    <span class="type">multiboot_info_t</span>* mboot
) {
    <span class="comment">// Welcome to bare metal!</span>
    <span class="comment">// No libc, no syscalls, nothing.</span>
    
    <span class="function">terminal_initialize</span>();
    <span class="function">terminal_write</span>(<span class="string">"Kernel loaded!\\n"</span>);
    
    <span class="function">init_gdt</span>();   <span class="comment">// Memory segmentation</span>
    <span class="function">init_idt</span>();   <span class="comment">// Interrupt handling</span>
    <span class="function">init_pmm</span>();   <span class="comment">// Physical memory</span>
    <span class="function">init_vmm</span>();   <span class="comment">// Virtual memory</span>
    
    <span class="keyword">while</span>(<span class="number">1</span>) { <span class="keyword">asm</span>(<span class="string">"hlt"</span>); }
}`,
                lang: "C",
                insight: "There's no printf, no malloc, no file I/O. Every capability your OS needs must be implemented by you. This is true systems programming."
            }
        ];
        
        let currentStep = 0;
        
        function init() {
            const timeline = document.querySelector('.timeline');
            
            steps.forEach((step, i) => {
                const marker = document.createElement('button');
                marker.className = 'step-marker';
                marker.setAttribute('aria-label', `Step ${i + 1}: ${step.title}`);
                marker.textContent = i + 1;
                marker.innerHTML += `<span class="step-label">${step.title}</span>`;
                marker.addEventListener('click', () => goToStep(i));
                timeline.appendChild(marker);
            });
            
            document.getElementById('btn-prev').addEventListener('click', () => goToStep(currentStep - 1));
            document.getElementById('btn-next').addEventListener('click', () => goToStep(currentStep + 1));
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    goToStep(currentStep + 1);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToStep(currentStep - 1);
                }
            });
            
            renderStep();
        }
        
        function goToStep(index) {
            if (index < 0 || index >= steps.length) return;
            currentStep = index;
            renderStep();
        }
        
        function renderStep() {
            const step = steps[currentStep];
            
            // Update timeline markers
            document.querySelectorAll('.step-marker').forEach((marker, i) => {
                marker.classList.remove('active', 'completed');
                if (i === currentStep) marker.classList.add('active');
                else if (i < currentStep) marker.classList.add('completed');
            });
            
            // Update timeline progress
            const progress = document.getElementById('timeline-progress');
            const progressWidth = (currentStep / (steps.length - 1)) * 100;
            progress.style.width = `calc(${progressWidth}% - ${progressWidth * 1.2}px)`;
            
            // Update components
            document.querySelectorAll('.component-card').forEach(card => {
                card.classList.toggle('active', step.components.includes(card.id));
            });
            
            // Update statuses
            document.getElementById('cpu-status').textContent = step.status.cpu;
            document.getElementById('bios-status').textContent = step.status.bios;
            document.getElementById('disk-status').textContent = step.status.disk;
            
            // Update flow nodes
            document.querySelectorAll('.flow-node').forEach(node => {
                node.classList.toggle('active', step.flow.includes(node.id));
            });
            
            // Update flow arrows
            ['arrow-1', 'arrow-2'].forEach(id => {
                const arrow = document.getElementById(id);
                arrow.classList.toggle('active', step.arrows.includes(id));
            });
            
            // Update memory blocks
            document.querySelectorAll('.memory-block').forEach(block => {
                const region = block.dataset.region;
                block.classList.toggle('active', step.memory.includes(region));
            });
            
            // Update info panel
            const infoPanel = document.getElementById('info-panel');
            infoPanel.innerHTML = `
                <div class="step-badge">
                    <span class="step-badge-num">${currentStep + 1}</span>
                    Step ${currentStep + 1} of ${steps.length}
                </div>
                <h2 class="step-title">${step.title}</h2>
                <p class="step-desc">${step.description}</p>
                <div class="code-container">
                    <div class="code-header">
                        <span class="code-dot red"></span>
                        <span class="code-dot yellow"></span>
                        <span class="code-dot green"></span>
                        <span class="code-lang">${step.lang}</span>
                    </div>
                    <div class="code-body"><pre>${step.code}</pre></div>
                </div>
                <div class="insight-box">
                    <div class="insight-label">💡 Key Insight</div>
                    <div class="insight-text">${step.insight}</div>
                </div>
            `;
            
            // Update buttons
            document.getElementById('btn-prev').disabled = currentStep === 0;
            document.getElementById('btn-next').disabled = currentStep === steps.length - 1;
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
